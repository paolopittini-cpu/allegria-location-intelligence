
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allegria Location Intelligence</title>
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin:0; font-family:Arial,sans-serif; }
    header { background:#142b39; color:white; padding:18px; }
    h2 { margin:0 0 6px; }
    .controls { padding:12px; background:#f1f5f9; }
    input { padding:10px; width:210px; max-width:55%; }
    button { padding:11px; cursor:pointer; }
    #map { height:calc(100vh - 180px); min-height:350px; }
    #status { padding:10px; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <h2>ALLEGRIA LOCATION INTELLIGENCE</h2>
    <small>Analisi territoriale internazionale</small>
  </header>

  <div class="controls">
    <input id="city" value="Paris, France"
      placeholder="Cerca una città">
    <button onclick="searchCity()">Cerca città</button>
    <button onclick="loadLaundries()">Lavanderie</button>
  </div>

  <div id="status">Mappa pronta.</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([48.8566, 2.3522], 12);
    const layer = L.layerGroup().addTo(map);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution:'&copy; OpenStreetMap contributors',
        maxZoom:19
      }
    ).addTo(map);

    function status(message) {
      document.getElementById('status').textContent = message;
    }

    async function searchCity() {
      const city = document.getElementById('city').value.trim();
      if (!city) return;
      status('Ricerca città...');
      try {
        const url = 'https://nominatim.openstreetmap.org/search?' +
          new URLSearchParams({q:city,format:'json',limit:'1'});
        const response = await fetch(url);
        if (!response.ok) throw new Error('Geocodifica non disponibile');
        const data = await response.json();
        if (!data.length) {
          status('Città non trovata.');
          return;
        }
        layer.clearLayers();
        map.setView([Number(data[0].lat),Number(data[0].lon)],13);
        status('Città selezionata: ' + data[0].display_name);
      } catch(e) {
        status('Errore nella ricerca della città.');
      }
    }

    async function loadLaundries() {
      layer.clearLayers();
      status('Ricerca lavanderie in corso...');
      const b = map.getBounds();
      const bbox = [
        b.getSouth(),b.getWest(),b.getNorth(),b.getEast()
      ].join(',');

      const query = '[out:json][timeout:40];(' +
        'nwr["shop"="laundry"](' + bbox + ');' +
        'nwr["shop"="dry_cleaning"](' + bbox + ');' +
        ');out center;';

      try {
        const response = await fetch(
          'https://overpass.kumi.systems/api/interpreter',
          {method:'POST',body:new URLSearchParams({data:query})}
        );
        if (!response.ok) throw new Error('Servizio non disponibile');
        const data = await response.json();
        let count = 0;

        for (const item of data.elements) {
          const lat = item.lat ?? item.center?.lat;
          const lon = item.lon ?? item.center?.lon;
          if (lat == null || lon == null) continue;
          const name = item.tags?.name || 'Lavanderia';
          const safeName = document.createElement('div');
          safeName.textContent = name;
          L.marker([lat,lon]).bindPopup(safeName).addTo(layer);
          count++;
        }
        status('Attività trovate: ' + count +
          ' (lavanderie e tintorie censite in OpenStreetMap)');
      } catch(e) {
        status('Servizio temporaneamente non disponibile. Riprova.');
      }
    }
  </script>
</body>
</html>
